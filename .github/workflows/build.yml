name: Build CS3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build plugins
        run: |
          chmod +x gradlew
          ./gradlew makePlugins --no-daemon --stacktrace

      - name: Collect .cs3 files
        run: find . -name "*.cs3" -exec mv {} . \;

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-release
          name: pre-release
          prerelease: true
          files: "*.cs3"
